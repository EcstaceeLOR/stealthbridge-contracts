name: Soroban contract checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy
      - name: Install pinned Stellar CLI (no accounts or network transactions)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v27.1.0 --repo stellar/stellar-cli --pattern stellar-cli-27.1.0-x86_64-unknown-linux-gnu.tar.gz --dir "$RUNNER_TEMP/stellar"
          tar -xzf "$RUNNER_TEMP/stellar/stellar-cli-27.1.0-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP/stellar"
          echo "$RUNNER_TEMP/stellar" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - name: Audit Soroban source signatures with native Rust (not Python)
        run: |
          rustc --edition=2021 -D warnings tools/source-audit.rs -o "$RUNNER_TEMP/soroban-source-audit"
          "$RUNNER_TEMP/soroban-source-audit"
          rustc --edition=2021 --test -D warnings tools/source-audit.rs -o "$RUNNER_TEMP/soroban-source-audit-tests"
          "$RUNNER_TEMP/soroban-source-audit-tests"
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked --target wasm32v1-none --release
      - name: Enforce proof, disclosure and cross-wallet evidence before private transfer claims
        run: python3 scripts/check_privacy_evidence.py
      - name: Enforce issuer privacy and redemption remain independently unverified
        run: python3 scripts/check_issuer_capabilities.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/artifacts.py
      - name: Independently verify every Soroban WASM and ABI digest
        run: python3 scripts/verify_artifacts.py
      - name: Ensure three-contract deployment preflight makes no live claims
        run: python3 scripts/preflight_testnet.py
      - run: python3 scripts/validate_manifest.py
      - name: Reject unsigned or unsupported Testnet deployment evidence
        run: python3 scripts/validate_deployment_evidence.py
      - run: python3 scripts/verify_public_interface.py
      - run: python3 scripts/benchmark.py
      - uses: actions/upload-artifact@v4
        with:
          name: corridor-registry-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
