[package]
name = "stealthbridge-fee-vault"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
crate-type = ["cdylib", "lib"]
[dependencies]
soroban-sdk = "=27.0.6"
[dev-dependencies]
soroban-sdk = { version = "=27.0.6", features = ["testutils"] }
[workspace]
resolver = "2"
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
